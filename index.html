<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hours Converter</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --border: #e3e2e0;
    --accent: #2383e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --text: #e6e6e5;
      --muted: #9b9a97;
      --border: #373737;
      --accent: #529cca;
    }
  }
  * { box-sizing: border-box; }
  html, body { overflow: hidden; }
  body {
    margin: 0;
    padding: 8px 2px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 16px; }
  input {
    width: 200px;
    max-width: 50%;
    font: inherit;
    font-size: 18px;
    padding: 8px 10px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .result {
    font-size: 24px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .result.error { font-size: 14px; font-weight: 400; color: var(--muted); white-space: normal; }
</style>
</head>
<body>
  <label for="hours">Decimal to hours/minutes converter</label>
  <div class="row">
    <input id="hours" type="text" inputmode="decimal" placeholder="e.g. 2.67" autocomplete="off" autofocus>
    <div class="result" id="result" aria-live="polite"></div>
  </div>
<script>
  const input = document.getElementById('hours');
  const result = document.getElementById('result');

  function convert(raw) {
    const text = raw.trim().replace(',', '.');
    if (text === '') return { out: '' };
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(text)) return { out: 'Enter a number, like 2.67', error: true };

    const value = Number(text);
    const sign = value < 0 ? '-' : '';
    const totalMinutes = Math.round(Math.abs(value) * 60);
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    return { out: `${sign}${h}h ${m}m` };
  }

  input.addEventListener('input', () => {
    const { out, error } = convert(input.value);
    result.textContent = out;
    result.classList.toggle('error', !!error);
  });
</script>
</body>
</html>
