<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hours Converter</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --border: #e3e2e0;
    --accent: #2383e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --text: #e6e6e5;
      --muted: #9b9a97;
      --border: #373737;
      --accent: #529cca;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 420px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 20px;
    padding: 10px 12px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .result {
    margin-top: 16px;
    font-size: 32px;
    font-weight: 600;
    min-height: 40px;
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <label for="hours">Decimal hours</label>
  <input id="hours" type="text" inputmode="decimal" placeholder="e.g. 2.67" autocomplete="off" autofocus>
  <div class="result" id="result" aria-live="polite"></div>
  <div class="hint" id="hint"></div>
</div>
<script>
  const input = document.getElementById('hours');
  const result = document.getElementById('result');
  const hint = document.getElementById('hint');

  function convert(raw) {
    const text = raw.trim().replace(',', '.');
    if (text === '') return { out: '', hint: '' };
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(text)) return { out: '', hint: 'Enter a number, like 2.67' };

    const value = Number(text);
    const sign = value < 0 ? '-' : '';
    const totalMinutes = Math.round(Math.abs(value) * 60);
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    return { out: `${sign}${h}h ${m}m`, hint: '' };
  }

  input.addEventListener('input', () => {
    const { out, hint: h } = convert(input.value);
    result.textContent = out;
    hint.textContent = h;
  });
</script>
</body>
</html>
